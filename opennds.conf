# ====================================================================
# openNDS (Forwarding Authentication Service - FAS) Configuration
# Coffee Shop / Guest Wi-Fi Authentication Platform
# ====================================================================

# GatewayInterface specifies the guest bridge or VLAN interface (e.g., br-guest / wlan0-1)
GatewayInterface br-guest

# GatewayName displayed on local router status pages
GatewayName Guest Wi-Fi Access

# Maximum session duration (240 minutes = 4 hours)
MaxSessionDuration 240

# Pre-auth idle timeout in minutes
PreauthIdleTimeout 10

# AuthIdleTimeout in minutes (0 = disabled)
AuthIdleTimeout 0

# Checkinterval in seconds (frequency of checking client status)
CheckInterval 30

# FAS Configuration (Level 4: Secure Remote Token Authentication)
# FAS level 4 sends client MAC, IP, tok, and gateway hash to the remote Next.js app
fasport 443
faspath /wifi
fasremoteip app.example.com
fassecureurl 1
faskey 3f9a7b1c8d4e2f6a5b0c9d8e7f1a3b5c

# Allowed Walled Garden Domains (Bypass interception before authentication)
# Must allow the Next.js domain and Google font CDN
WalledGardenURL app.example.com fonts.googleapis.com fonts.gstatic.com

# Debug Level (0 = silent, 1 = normal, 2 = verbose, 3 = debug)
debuglevel 1

# Router Admin Port (Blocked for guest clients)
# Guest firewall rules automatically block ports 22 (SSH), 80/443 (Router WebUI)
